<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Layout Streaming - Rol</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=MedievalSharp&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-bg: #0d0a08;
    --color-panel: #1a1410;
    --color-border: #be9e55;
    --color-gold: #d4af37;
    --color-parchment: #e8d9b0;
    --color-text: #f0e6d2;
    
    /* Nuevas Dimensiones */
    --total-width: 1920px;
    --total-height: 1080px;
    --padding: 12px;
    --gap: 12px;
    
    --col-right-width: 447px;
    --tablero-width: 1437px;


    --board-border-size: 6px;
    --board-corner-size: calc(var(--board-border-size) * 14);
    --minus-board-border-size: calc((var(--board-border-size) - 1px) * -1);

    --chat-corner-size: calc(var(--board-border-size) * 8);
    
    --border-corner: url("./assets/border_corner.svg");
    --border-sheet-actor-corner: url("./assets/border_sheet_actor_corner.svg");
    --border-sheet-item-corner: url("./assets/border_sheet_item_corner.svg");
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: var(--total-width);
    height: var(--total-height);
    background: var(--color-bg);
    font-family: 'Amiri', serif;
    color: var(--color-text);
  max-width: var(--total-width);  /* ← Añadir */
  max-height: var(--total-height);
  
  overflow: hidden;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(212,175,55,0.05) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(139,111,61,0.08) 0%, transparent 50%);
  }

  /* Layout principal con proporción áurea */
  .layout {
    display: grid;
    grid-template-columns: var(--tablero-width) var(--col-right-width);
    gap: var(--gap);
    padding: var(--padding);
    width: 100%;
    height: 100%;
      max-width: var(--total-width);  /* ← Añadir */
  max-height: var(--total-height);
  
  overflow: hidden;
  }

  /* Marco decorativo común */
.panel {
  background: var(--color-panel);
  border: var(--board-border-size) solid var(--color-border);
  position: relative;
  box-shadow:
    inset 0 0 30px rgba(0,0,0,0.6),
    0 0 15px rgba(212,175,55,0.15);
  overflow: hidden;
  min-height: 0;             /* ← NUEVO: evita que el grid item crezca */
  min-width: 0;              /* ← NUEVO */
}

  .panel::before {
    content: "";
    position: absolute;
    inset: 4px;
    border: 1px solid rgba(212,175,55,0.25);
    border-radius: 4px;
    pointer-events: none;
  }

  .panel-title {
    position: absolute;
    top: -1px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--color-panel);
    padding: 2px 18px;
    border: 1px solid var(--color-border);
    border-top: none;
    border-radius: 0 0 6px 6px;
    color: var(--color-gold);
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
    z-index: 2;
  }

  /* === ÁREA 1: Tablero Virtual (proporción mayor) === */
  .tablero {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #00B140;
  }

 /* === COLUMNA DERECHA (DM, Chat1, Chat2) === */
.columna-derecha {
  display: grid;
  grid-template-rows: 1fr 3fr 1fr;
  gap: var(--gap);
  height: 100%;              /* ← NUEVO */
  min-height: 0;             /* ← NUEVO */
}

  /* === ÁREA 2: Arte del DM === */
  .dm {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px;
    text-align: center;
  }

  .dm-marco {
    width: 140px;
    height: 140px;
    border: 3px double var(--color-gold);
    border-radius: 50%;
    padding: 4px;
    background: #000;
    margin-bottom: 10px;
    box-shadow: 0 0 20px rgba(212,175,55,0.4);
  }

  .dm-marco img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
  }

  .dm-nombre {
    color: var(--color-gold);
    font-size: 18px;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  .dm-rol {
    font-size: 11px;
    color: var(--color-parchment);
    opacity: 0.7;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  /* === ÁREA 3: Chat Principal === */
  .chat1 {
    padding: 25px 15px 15px;
    display: flex;
    flex-direction: column;
  }

  /* === ÁREA 4: Chat Secundario === */
  .chat2 {
    padding: 25px 15px 15px;
    display: flex;
    flex-direction: column;
  }

  /* Ornamentos de esquina */
  .corner {
    position: absolute;
    background-color: var(--color-border);

    /*-webkit-mask:
        var(--border-corner) no-repeat center;

    mask:
        var(--border-corner) no-repeat center;

    -webkit-mask-size: 100% 100%;
    mask-size: 100% 100%;*/
  }

  .chat.corner{ 
    width: var(--chat-corner-size);  /* Ajusta el tamaño según tu SVG */
    height: var(--chat-corner-size);
    mask:
        var(--border-sheet-item-corner) no-repeat center;
    mask-size: 100% 100%;
  }

  .tabletop.corner{ 
    width: var(--board-corner-size);  /* Ajusta el tamaño según tu SVG */
    height: var(--board-corner-size);
    mask:
        var(--border-sheet-actor-corner) no-repeat center;
    mask-size: 100% 100%;
  }

.box-corners {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 2;
}

  /* Rotación para cada esquina */
  .corner.tl {top: var(--minus-board-border-size); left: var(--minus-board-border-size); }
  .corner.tr {top: var(--minus-board-border-size); right: var(--minus-board-border-size); transform: scaleX(-1); }
  .corner.bl {bottom: var(--minus-board-border-size); left: var(--minus-board-border-size); transform: scaleY(-1); }
  .corner.br {bottom: var(--minus-board-border-size); right: var(--minus-board-border-size); transform: scale(-1, -1); }

</style>
</head>
<body>

<div class="layout">

  <!-- ÁREA 1: TABLERO VIRTUAL (Proporción Mayor: 1172px) -->

    <div class="panel tablero">
        <div class="panel-title">⚔ Foundry ⚔</div>
        <div class="tabletop corner tl"></div><div class="tabletop corner tr"></div>
        <div class="tabletop corner bl"></div><div class="tabletop corner br"></div>
    </div>


  <!-- COLUMNA DERECHA (Reorganizada) -->
  <div class="columna-derecha">

    <!-- ÁREA 2: ARTE DEL DM -->
    <div class="panel dm">
      <div class="dm-marco">
        <img src="https://via.placeholder.com/140/1a1410/d4af37?text=DM" alt="DM">
      </div>
      <div class="dm-nombre">Omegavic</div>
      <div class="dm-rol">Dungeon Master</div>
    </div>

    <!-- ÁREA 3: CHAT PRINCIPAL (Mayor espacio) -->
    <div class="panel chat1">
      <div class="panel-title">Chat Discord</div>
      <div class="chat corner tl"></div><div class="chat corner tr"></div>
      <div class="chat corner bl"></div><div class="chat corner br"></div>
    </div>

    <!-- ÁREA 4: CHAT SECUNDARIO (Mismo espacio que DM) -->
    <div class="panel chat2">
      <div class="panel-title">Chat Youtube</div>
      <div class="chat corner tl"></div><div class="chat corner tr"></div>
      <div class="chat corner bl"></div><div class="chat corner br"></div>
    </div>

  </div>
</div>

</body>
</html>
