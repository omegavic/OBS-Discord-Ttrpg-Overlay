<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Discord Overlay — Foreground Layer</title>

<!-- Fuente de Google (opcional, estilo fantasía) -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital@1&display=swap" rel="stylesheet">

<style>
  :root {
    --accent: #be9e55;
    --background: #3d3b3c;
    --border-corner-svg: url("./assets/border_corner.svg");
    
    --mask-gradient: calc(16px - 4px);
    --minus-mask-gradient: calc(var(--mask-gradient) * -1)
  }
  html, body {
    margin: 0;
    width: 100vw;
    height: 100vh;
    background: transparent;
    overflow: hidden;
    font-family: 'Amiri';
  }

  /* === CONTENEDOR DE CADA JUGADOR === */
  .slot {
    position: absolute;
    width: 140px;
    height: 140px;
  }

  /* === PLACA DE NOMBRE === */
  .name-plate {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
  min-width: 150px;            /* antes 200 */
  padding: 6px 14px 7px 14px; 
    text-align: center;
    
    /* Fondo con gradiente estilo pergamino oscuro */

  }
.panel-background {
    position: absolute;
    inset: 0;

    background: linear-gradient(
      135deg,
      rgba(20, 12, 5, 0.92) 0%,
      rgba(45, 28, 12, 0.88) 50%,
      rgba(20, 12, 5, 0.92) 100%
    );
        -webkit-mask:
        radial-gradient(
            8px at 8px 8px,
            transparent 98%,
            black
        ) -8px -8px;

    mask:
        radial-gradient(
            var(--mask-gradient) at var(--mask-gradient) var(--mask-gradient),
            transparent 98%,
            black
        ) var(--minus-mask-gradient) var(--minus-mask-gradient);
    /* Borde dorado sutil */
    border: 4px solid #be9e55;
    border-radius: 4px;
    
    /* Sombra para dar profundidad */
    box-shadow: 
      0 4px 20px rgba(0, 0, 0, 0.6),
      inset 0 1px 0 rgba(212, 175, 55, 0.15);
      
    z-index: 0;
}

  /* === TIPOGRAFÍA === */
  .character-name {
    color: #f4d47c;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    text-shadow: 
      0 0 8px rgba(212, 175, 55, 0.4),
      2px 2px 4px rgba(0, 0, 0, 0.9);
    line-height: 1.2;
  }

  .player-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 14px;
    font-style: italic;
    color: #b8a070;
    margin-top: 4px;
    letter-spacing: 0.5px;
  }

  /* Separador decorativo entre nombre y jugador */
  .separator {
    width: 60%;
    height: 1px;
    margin: 6px auto 4px auto;
    background: linear-gradient(
      90deg,
      transparent 0%,
      rgba(212, 175, 55, 0.5) 50%,
      transparent 100%
    );
  }



  .corner {
    position: absolute;
    width: 16px;  /* Ajusta el tamaño según tu SVG */
    height: 16px;
    background-color: #be9e55;

    -webkit-mask:
        var(--border-corner-svg) no-repeat center;

    mask:
        var(--border-corner-svg) no-repeat center;

    -webkit-mask-size: 100% 100%;
    mask-size: 100% 100%;
  }

.box-corners {
    position: absolute;
    inset: 0;

    display: flex;
    flex-direction: column;
    justify-content: space-between;

    pointer-events: none;
    z-index: 2;
}

  /* Rotación para cada esquina */

  .corner.tr { 
    top: -0px; 
    right: -0px; 
    transform: scaleX(-1);  /* Voltea horizontalmente */
  }
  .corner.bl { 
    bottom: -0px; 
    left: -0px; 
    transform: scaleY(-1);  /* Voltea verticalmente */
  }
  .corner.br { 
    bottom: -0px; 
    right: -0px; 
    transform: scale(-1, -1);  /* Voltea ambos ejes */
  }

.panel-content {
    position: relative;
    z-index: 1;
}

</style>
</head>
